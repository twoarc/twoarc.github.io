<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verified | GoalX</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f8fa;
      padding: 24px;
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(17, 24, 39, 0.06);
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 28px;
    }

    .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #16a34a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 22px;
      font-weight: 700;
    }

    h1 {
      font-size: 24px;
      font-weight: 750;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }

    p {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.6;
      max-width: 320px;
      margin: 0 auto;
    }

    .small {
      margin-top: 26px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">GoalX</div>

    <div class="icon">✓</div>

    <h1>Email verified</h1>

    <p>
      Your email address has been confirmed. You can now return to GoalX and sign in to your account.
    </p>

    <div class="small">
      You may safely close this page.
    </div>
  </main>
</body>
</html>
