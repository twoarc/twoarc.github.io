<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verified</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff7cc 0%, #ffd700 45%, #ffb300 100%);
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 28px;
      padding: 42px 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
    }

    .icon {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: #22c55e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      margin: 0 auto 24px;
      font-weight: 800;
    }

    h1 {
      font-size: 28px;
      color: #111827;
      margin-bottom: 14px;
      font-weight: 800;
    }

    p {
      color: #4b5563;
      font-size: 16px;
      line-height: 1.6;
    }

    .small {
      margin-top: 18px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">✓</div>

    <h1>Email verified</h1>

    <p>
      Your email address has been successfully verified.
      You can now sign in to your account.
    </p>

    <div class="small">
      You may safely close this page.
    </div>
  </div>
</body>
</html>
