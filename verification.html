<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hesabınız Onaylandı</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff7cc 0%, #ffd700 45%, #ffb300 100%);
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 28px;
      padding: 42px 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
    }

    .icon {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: #22c55e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      margin: 0 auto 24px;
      font-weight: 800;
    }

    h1 {
      font-size: 28px;
      color: #111827;
      margin-bottom: 14px;
      font-weight: 800;
    }

    p {
      color: #4b5563;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    a {
      display: inline-block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 16px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    }

    .small {
      margin-top: 18px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">✓</div>

    <h1>Hesabınız onaylandı</h1>

    <p>
      E-posta adresiniz başarıyla doğrulandı.
      Artık hesabınıza giriş yapabilirsiniz.
    </p>

    <a href="/">Giriş Yap</a>

    <div class="small">
      Bu sayfayı güvenle kapatabilirsiniz.
    </div>
  </div>
</body>
</html>
