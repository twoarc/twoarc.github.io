<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking Filter: Fun Challenge</title>
<meta name="description" content="The viral ranking filter: items pop up above your head one by one and you rank them blind. Free on iPhone and Android.">
<meta property="og:title" content="Ranking Filter: Fun Challenge">
<meta property="og:description" content="Rank anything above your head. Free on iPhone and Android.">
<meta property="og:image" content="https://twoarc.github.io/rf/icon.png">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #f6f2ff; --card: #ffffff; --text: #1d1530; --muted: #6b6380; --accent: #7b2cf5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #120d1d; --card: #1d1630; --text: #f3efff; --muted: #a59cbd; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { width: 100%; max-width: 380px; background: var(--card); border-radius: 24px; padding: 32px 24px; text-align: center;
    box-shadow: 0 12px 40px rgba(40, 20, 80, .12); }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: block; padding: 14px; margin-top: 10px; border-radius: 14px; background: var(--accent); color: #fff;
    text-decoration: none; font-weight: 700; }
  a.btn.alt { background: transparent; color: var(--text); border: 2px solid var(--accent); }
  small { display: block; margin-top: 18px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Ranking Filter app icon">
  <h1>Ranking Filter: Fun Challenge</h1>
  <p>Items pop up above your head one by one — rank them blind, no take-backs. Free!</p>
  <a class="btn" id="ios" href="https://apps.apple.com/app/id6757232644">Download on the App Store</a>
  <a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=com.twoarc.rankingfilterfunchallenge&amp;referrer=utm_source%3Dtiktok%26utm_medium%3Dbio">Get it on Google Play</a>
  <small>Opening the store for your phone…</small>
</main>
<script>
  // Phones go straight to their store; computers see both buttons.
  var ua = navigator.userAgent || "";
  var target = /android/i.test(ua) ? "android" : /iphone|ipad|ipod/i.test(ua) ? "ios" : null;
  if (target) { location.replace(document.getElementById(target).href); }
  else { document.querySelector("small").textContent = "Scan or open this page on your phone, or pick your store above."; }
</script>
</body>
</html>
